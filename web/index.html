<!doctype html>
<html lang="pt-BR" data-tema="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QUANT" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <title>QUANT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%230b0d0c'/><rect x='4' y='12' width='32' height='32' rx='9' fill='%23f5b31a'/><rect x='11' y='31' width='5.5' height='7.5' rx='1.2' fill='%230b0d0c'/><rect x='19.5' y='27' width='5.5' height='11.5' rx='1.2' fill='%230b0d0c'/><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M5 31.5l9.5-8.5 5 4.2L40 8M31.5 7.5H40.5V16.5' stroke='%230b0d0c' stroke-width='9'/><path d='M5 31.5l9.5-8.5 5 4.2L40 8M31.5 7.5H40.5V16.5' stroke='%23ffcf33' stroke-width='4.2'/></g></svg>" />
    <script>
      // Aplica o tema salvo antes de pintar a tela (evita piscar na abertura).
      try {
        if (localStorage.getItem("quant.tema") === "claro") {
          document.documentElement.dataset.tema = "claro";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#d5cfc2");
        }
      } catch (e) {}
    </script>
    <style>
      /* Tela de abertura: aparece antes do JavaScript carregar. */
      #abertura {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #0b0d0c; color: #e6eae7;
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .5s ease, visibility .5s ease;
      }
      [data-tema="claro"] #abertura { background: #d5cfc2; color: #1c1e1d; }
      #abertura.saindo { opacity: 0; visibility: hidden; }
      #abertura .abertura-halo {
        position: absolute; width: 420px; height: 420px; border-radius: 50%;
        background: radial-gradient(circle, rgb(227 163 54 / .16), transparent 65%);
        animation: abertura-pulsar 2.4s ease-in-out infinite;
      }
      #abertura .abertura-logo {
        position: relative; display: block; overflow: visible; filter: drop-shadow(0 18px 40px rgb(245 160 20 / .28));
        animation: abertura-surgir .6s cubic-bezier(.2, .9, .3, 1.2) both;
      }
      #abertura .abertura-recorte { stroke: #0b0d0c; }
      #abertura .abertura-seta {
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: abertura-desenhar .7s .35s ease-out forwards;
      }
      #abertura .abertura-seta.ponta { animation-delay: 1s; animation-duration: .3s; }
      #abertura .abertura-nome {
        position: relative; margin: 0; display: flex; align-items: baseline;
        font-size: 34px; font-weight: 700; letter-spacing: .14em; text-indent: .14em;
        animation: abertura-subir .6s .5s ease-out both;
      }
      #abertura .abertura-nome svg { width: .66em; height: .72em; fill: #f5b31a; margin-right: .1em; }
      [data-tema="claro"] #abertura .abertura-nome svg { fill: #c97a00; }
      #abertura .abertura-sub {
        position: relative; margin: -12px 0 0; font-size: 14px; opacity: .6;
        animation: abertura-subir .6s .65s ease-out both;
      }
      #abertura .abertura-barra {
        position: relative; width: 140px; height: 3px; border-radius: 99px; overflow: hidden;
        background: rgb(127 127 127 / .2); animation: abertura-subir .6s .75s ease-out both;
      }
      #abertura .abertura-barra::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 99px; background: #e3a336;
        animation: abertura-correr 1.1s ease-in-out infinite;
      }
      @keyframes abertura-surgir { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes abertura-desenhar { to { stroke-dashoffset: 0; } }
      @keyframes abertura-subir { from { opacity: 0; transform: translateY(10px); } }
      @keyframes abertura-correr { from { left: -40%; } to { left: 100%; } }
      @keyframes abertura-pulsar { 50% { transform: scale(1.12); opacity: .7; } }
      @media (prefers-reduced-motion: reduce) {
        #abertura *, #abertura *::after { animation: none !important; }
        #abertura .abertura-seta { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="abertura" role="status" aria-live="polite" aria-label="Carregando QUANT">
      <div class="abertura-halo"></div>
      <svg class="abertura-logo" width="96" height="96" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="abertura-ouro" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#ffcf33" /><stop offset="1" stop-color="#f59a0b" />
          </linearGradient>
          <clipPath id="abertura-quadro"><rect x="4" y="12" width="32" height="32" rx="9" /></clipPath>
        </defs>
        <rect x="4" y="12" width="32" height="32" rx="9" fill="url(#abertura-ouro)" />
        <rect x="11" y="31" width="5.5" height="7.5" rx="1.2" fill="#0b0d0c" />
        <rect x="19.5" y="27" width="5.5" height="11.5" rx="1.2" fill="#0b0d0c" />
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g clip-path="url(#abertura-quadro)">
            <path class="abertura-recorte abertura-seta" d="M5 31.5l9.5-8.5 5 4.2L40 8" stroke-width="9" pathLength="1" />
            <path class="abertura-recorte abertura-seta ponta" d="M31.5 7.5H40.5V16.5" stroke-width="9" pathLength="1" />
          </g>
          <path class="abertura-seta" d="M5 31.5l9.5-8.5 5 4.2L40 8" stroke="url(#abertura-ouro)" stroke-width="4.2" pathLength="1" />
          <path class="abertura-seta ponta" d="M31.5 7.5H40.5V16.5" stroke="#ffcf33" stroke-width="4.2" pathLength="1" />
        </g>
      </svg>
      <h1 class="abertura-nome" aria-label="QUANT"><span aria-hidden="true">QU</span><svg viewBox="0 0 12 14" aria-hidden="true"><polygon points="0,14 4.5,0 7.5,0 12,14 8.9,14 6,4.6 3.1,14" /></svg><span aria-hidden="true">NT</span></h1>
      <p class="abertura-sub">Carteira simulada guiada por notícias</p>
      <div class="abertura-barra"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
